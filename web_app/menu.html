<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melody Menu</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(160deg, #10131a 0%, #1c2230 60%, #10131a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 22px 16px 32px;
      font-family: 'Segoe UI', sans-serif;
    }

    .title {
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #9aa4b8;
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 420px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 16px 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      letter-spacing: 0.3px;
      transition: transform 0.1s ease, opacity 0.1s ease, filter 0.1s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .btn:active { transform: scale(0.95); filter: brightness(0.9); }

    /* Colors matched to the reference screenshot's 3-color scheme */
    .c-blue  { background: #2E6DA4; }
    .c-red   { background: #B3413A; }
    .c-green { background: #2E8B4F; }

    .empty-state {
      color: #9aa4b8;
      font-size: 13px;
      text-align: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="title" id="title">Menu</div>
  <div class="subtitle" id="subtitle"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    This menu link is missing or invalid.
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#10131a');
    tg.setBackgroundColor('#10131a');

    function b64urlDecode(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      const bin = atob(str);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    function render() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('spec');
      if (!raw) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      let spec;
      try {
        spec = JSON.parse(b64urlDecode(raw));
      } catch (e) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      document.getElementById('title').textContent = spec.title || 'Menu';
      document.getElementById('subtitle').textContent = spec.subtitle || '';

      const grid = document.getElementById('grid');
      (spec.rows || []).forEach((row) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        row.forEach((b) => {
          const btnEl = document.createElement('button');
          const color = ['blue', 'red', 'green'].includes(b.color) ? b.color : 'blue';
          btnEl.className = `btn c-${color}`;
          btnEl.textContent = (b.icon ? b.icon + ' ' : '') + b.label;
          btnEl.onclick = () => tap(spec.menu, b);
          rowEl.appendChild(btnEl);
        });
        grid.appendChild(rowEl);
      });
    }

    function tap(menuId, b) {
      if (b.href) {
        if (b.href.startsWith('https://t.me') && tg.openTelegramLink) {
          tg.openTelegramLink(b.href);
        } else if (tg.openLink) {
          tg.openLink(b.href);
        } else {
          window.open(b.href, '_blank');
        }
        setTimeout(() => tg.close(), 150);
        return;
      }
      tg.sendData(`${menuId}:${b.action}`);
      setTimeout(() => tg.close(), 150);
    }

    render();
  </script>
</body>
</html>
